services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U nexo -d nexo']
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    restart: unless-stopped
    environment:
      DEBUG: 'false'
      SECRET_KEY: ${SECRET_KEY:?Configure SECRET_KEY}
      DATABASE_URL: postgresql://nexo:${POSTGRES_PASSWORD}@db:5432/nexo
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Configure ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Configure CSRF_TRUSTED_ORIGINS}
      TRUST_PROXY: 'true'
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
